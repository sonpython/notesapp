name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [main]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Install cloudflared
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          cat >> ~/.ssh/config << EOF
          Host ${{ secrets.DEPLOY_HOST }}
            User ${{ secrets.DEPLOY_USER }}
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking no
          EOF

      - name: Deploy
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/notesapp' }}
        run: |
          ssh ${{ secrets.DEPLOY_HOST }} "GH_TOKEN=$GH_TOKEN DEPLOY_PATH=$DEPLOY_PATH bash -s" << 'DEPLOY_SCRIPT'
            set -e
            cd "$DEPLOY_PATH"

            echo "📥 Pulling latest code..."
            git config credential.helper '!f() { echo "password=$GH_TOKEN"; }; f'
            git fetch origin main
            git reset --hard origin/main
            git config --unset credential.helper

            echo "🔧 Loading environment..."
            set -a && source .env.production && set +a

            echo "🐳 Rebuilding containers..."
            docker compose -f docker-compose.production.yml pull
            docker compose -f docker-compose.production.yml up -d --build --remove-orphans

            echo "🗄️ Running migrations..."
            docker compose -f docker-compose.production.yml exec -T backend uv run alembic upgrade head || true

            echo "🧹 Cleaning up..."
            docker image prune -f

            echo "✅ Deployment complete!"
          DEPLOY_SCRIPT
