services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notesapp
      POSTGRES_PASSWORD: notesapp
      POSTGRES_DB: notesapp
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: notesapp
      MINIO_ROOT_PASSWORD: notesapp-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://notesapp:notesapp@postgres:5432/notesapp
      MINIO_ENDPOINT: minio:9000
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
      - minio
    volumes:
      - ./backend:/app
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    image: oven/bun:1
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      - PUBLIC_API_URL=http://localhost:8001
    volumes:
      - ./apps/web-svelte:/app
      - /app/node_modules
    command: sh -c "bun install && bun run dev --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
