services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notesapp
      POSTGRES_PASSWORD: notesapp
      POSTGRES_DB: notesapp
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://notesapp:notesapp@postgres:5432/notesapp
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
    volumes:
      - ./backend:/app
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    image: oven/bun:1
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      - PUBLIC_API_URL=http://localhost:8001
    volumes:
      - ./apps/web-svelte:/app
      - /app/node_modules
    command: sh -c "bun install && bun run dev --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  postgres_data:
